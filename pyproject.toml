[tool.ruff.lint]
ignore = [
  "D203",
  "D213"
]
select = [
  "C901",
  "D",
  "E",
  "E4",
  "E7",
  "E9",
  "F",
  "FAST",
  "FURB",
  "I",
  "PERF",
  "RUF",
  "W"
]

[tool.basedpyright]
typeCheckingMode='off' # disable linting as it seems to produce a lot of false positives when using pydantic
# reportUndefinedVariable = true
reportInvalidTypeForm = false
reportArgumentType = false
reportIncompatibleMethodOverride = false
reportAssignmentType = false

[tool.pyrefly]
#### configuring your type check settings
ignore-errors-in-generated-code = true
# use-untyped-imports = true
# ignore-missing-source = true
[tool.pyrefly.errors]
bad-assignment = false
invalid-argument = false
bad-argument-type=false
bad-override = false
unexpected-keyword = false
invalid-param-spec = false
unknown-name = false
missing-attribute = false
