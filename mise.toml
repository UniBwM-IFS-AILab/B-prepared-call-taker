[settings]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["python"]
windows_shim_mode = 'symlink'
env_shell_expand = true

[tools]
uv = "latest"
ruff = "latest"
sops = "latest"
ttyd = "latest"
fd = "latest"
direnv = "latest"
pre-commit =  { version = "latest", os = ["linux", "darwin"] }
ollama = "latest"
python = "3.13"
node = "latest"
"gitlab:graphviz/graphviz" = { version = "latest", exe = "dot" }
delta = "latest"
"pipx:git-filter-repo" = "latest"
hurl = "latest"
copilot = "latest"
"npm:llm-checker" = "latest"
"npm:yepanywhere" = "latest"

[env]
_.file = [".env.json", "env.json"]
AGE_PUBLIC_KEY = "age194dj36ngpzv4rg9pzkmxed6l2gr894de47d370qp28ln7eku440s8l6j63"
EDITOR = 'code'
# TODO: check if this causes bugs on linux, do we need the else branch?
# HOME = "{% if os() == 'windows' %}\"$HOMEPATH\"{% else %}$HOME{% endif %}" Does not work
SHELL = '{% if os() == "windows" %}pwsh{% else %}$SHELL{% endif %}'

SOPS_AGE_KEY_FILE = "{{xdg_config_home}}/mise/age.txt"
SOPS_EDITOR = 'code --wait --new-window --disable-extensions'

XDG_CONFIG_HOME = '{{xdg_config_home}}'
XDG_DATA_HOME = '{{xdg_data_home}}'
XDG_CACHE_HOME = '{{xdg_cache_home}}'
XDG_STATE_HOME = '{{xdg_state_home}}'
UV_CACHE_DIR = '/tmp/ems-prepared-uv'
MPLCONFIGDIR = '/tmp/ems-prepared-mplconfig'

[hooks]
enter = "mise i -q" # && mise en -s $env:SHELL"
# Todo:
# eval "$(ssh-agent -s)"
# ssh-add ~/.ssh/ld1bsekl

# above necessary for signing commits with ssh key. not sure if there is another way around it.

[settings.sops]
age_key_file = '~/.config/mise/age.txt'
strict = false
# age_recipients=

[tasks.llm_only]
alias = 'dumb'
run = "uv run main cli --policy agent"

[tasks.cli]
alias = 'ems'
run = "uv run main cli --policy graph"

[tasks.server]
run = "uv run --group server main fastapi"
# depends = ['ollama']

[tasks.server_dev]
run = "uv run --group server fastapi-server --reload"

[tasks.gradio]
# env = { SLACK_WEBHOOK_URL = "https://hooks.slack.com/services/XXX/YYY/ZZZ" }
run = "uv run --no-sync main gradio"

[tasks.gradio_dev]
env = { GRADIO_DEBUG = "1" }
run = '''
SCENARIO_DIR="${SCENARIO_DIR:-$(fd -t d -d 2 '^scenarios$' "{{config_root}}/experiments" | sort | head -n1)}"
if [ -z "$SCENARIO_DIR" ]; then
  echo "No scenario directory found under {{config_root}}/experiments/*/scenarios. Set SCENARIO_DIR explicitly." >&2
  exit 2
fi
uv run --no-sync main gradio --scenario-dir "$SCENARIO_DIR" --verbose
'''

[tasks.gradio_guided_llm_vs_graph]
description = "Launch the guided Gradio UI for the llm_vs_graph scenarios"
alias = 'gradio_guided'
run = '''
uv run --no-sync main gradio --ui guided --scenario-dir experiments/llm_vs_graph/scenarios/ --guided-scenario Scenario_01.md --guided-scenario Scenario_02.md
'''

[tasks.synthetic_single_turn_run]
description = "Run the synthetic single-turn pipeline from a single config file"
usage = '''
arg "[config]" help="Path to the synthetic single-turn config file" default="experiments/synthetic_single_turn/config.example.json"
'''
run = 'uv run --with-editable . experiments/synthetic_single_turn/pipeline.py --config "${usage_config?}"'

[tasks.knowledge_extraction_run]
description = "Run the knowledge extraction pipeline from a single config file"
usage = '''
arg "[config]" help="Path to the knowledge extraction config file" default="experiments/knowledge_extraction/config.example.json"
'''
run = 'uv run --with-editable . experiments/knowledge_extraction/pipeline.py --config "${usage_config?}"'

[tasks.openai_server_vllm]
description = "Start a vLLM OpenAI-compatible server on CUDA"
# env = { VLLM_TARGET_DEVICE = "cuda" }
# raw_args = true
usage = '''
flag "--model <model>" help="Model to serve" default="Qwen/Qwen3-14B"
flag "--host <host>" help="Host to bind" default="127.0.0.1"
flag "--port <port>" help="Port to bind" default="8000"
flag "--max-model-len <len>" help="Model Context length" default="auto"
'''
run = 'uvx --isolated vllm serve "${usage_model?}" --host "${usage_host?}" --port "${usage_port?}" "$@"'

[tasks.openai_server_sglang]
description = "Start an SGLang OpenAI-compatible server"
usage = '''
flag "--model <model>" help="Model to serve" default="Qwen/Qwen3-14B"
flag "--host <host>" help="Host to bind" default="127.0.0.1"
flag "--port <port>" help="Port to bind" default="8000"
flag "--device <device>" help="Device backend" default="cuda"
'''
run = 'uvx --isolated --prerelease allow --from sglang python -m sglang.launch_server --model-path "${usage_model?}" --host "${usage_host?}" --port "${usage_port?}" --device "${usage_device?}"'

[tasks.openai_server_ollama]
description = "Start an Ollama server"
run = "ollama serve"
