_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: Gradio Share URL Notifier
  description: Sends Gradio share URLs into a Slack channel via webhook.
  background_color: "#36C5F0"

features:
  bot_user:
    display_name: gradio-share-bot
    always_online: false

oauth_config:
  scopes:
    bot:
      - incoming-webhook

settings:
  incoming_webhooks:
    incoming_webhooks_enabled: true

  interactivity:
    is_enabled: false

  socket_mode_enabled: false
  org_deploy_enabled: false
